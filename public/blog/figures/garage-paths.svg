<path d="M522.5 196 l3 3 5.5 -6" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="544" y="200" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#0a1230">Single or double</text>
