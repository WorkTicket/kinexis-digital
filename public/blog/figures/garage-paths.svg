<path d="M54.5 196 l3 3 5.5 -6" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="76" y="200" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#0a1230">Phone first</text>
<rect x="50" y="216" width="16" height="16" rx="4" fill="#0b3dff"/>
<path d="M54.5 224 l3 3 5.5 -6" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="76" y="228" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#0a1230">Same-day only where you can keep</text>
<text x="76" y="248" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#0a1230">it</text>
<rect x="50" y="264" width="16" height="16" rx="4" fill="#0b3dff"/>
<path d="M54.5 272 l3 3 5.5 -6" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="76" y="276" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#0a1230">Spring, opener, or neither</text>
<rect x="496" y="122" width="436" height="214" rx="18" fill="url(#panel)" stroke="#e1e6f2"/>
<rect x="496" y="122" width="436" height="8" rx="4" fill="#ff6a00"/>
<rect x="518" y="146" width="91.2" height="28" rx="14" fill="#fff1e6"/>
<text x="534" y="165" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="800" fill="#ff6a00">New door</text>
