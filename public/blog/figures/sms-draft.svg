<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-label="A draft, not a campaign"><defs><linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#f4f7ff"/></linearGradient><linearGradient id="barTrack" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#eef2ff"/><stop offset="100%" stop-color="#f7f9ff"/></linearGradient></defs><rect width="960" height="520" fill="#ffffff"/><rect x="0" y="0" width="8" height="520" fill="#0b3dff"/>
<rect x="28" y="24" width="52" height="6" rx="3" fill="#ff6a00"/>
<text x="28" y="68" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="800" letter-spacing="-0.02em" fill="#0a1230">A draft, not a campaign</text>
<text x="28" y="88" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#53607e">Have a compliance review before you send it.</text>
<text x="28" y="130" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" fill="#0a1230">Name the business, name the miss, and</text>
<text x="28" y="156" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" fill="#0a1230">ask for the job type. Opt-out rules</text>
<text x="28" y="182" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" fill="#0a1230">still apply.</text>
<rect x="560" y="122" width="260" height="420" rx="36" fill="#0a1230"/>
<rect x="572" y="134" width="236" height="396" rx="28" fill="#ffffff"/>
<rect x="656" y="146" width="68" height="8" rx="4" fill="#e1e6f2"/>
<rect x="592" y="178" width="196" height="42" rx="12" fill="#f4f7ff" stroke="#e1e6f2"/>
<text x="608" y="205" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#53607e">Your business name</text>
<rect x="592" y="232" width="196" height="42" rx="12" fill="#f4f7ff" stroke="#e1e6f2"/>
<text x="608" y="259" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#53607e">We missed your call</text>
<rect x="592" y="286" width="196" height="42" rx="12" fill="#f4f7ff" stroke="#e1e6f2"/>
<text x="608" y="313" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#53607e">Reply with the job</text>
<rect x="592" y="340" width="196" height="42" rx="12" fill="#f4f7ff" stroke="#e1e6f2"/>
<text x="608" y="367" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#53607e">The best number</text>
