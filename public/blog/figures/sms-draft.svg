<text x="690" y="431" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="800" fill="#ffffff">Example only</text>
<line x1="28" y1="476" x2="932" y2="476" stroke="#e1e6f2" stroke-width="1"/>
<text x="28" y="494" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#53607e">Wireframe only. Not a live message or form.</text>
