name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Design system lint
        run: npm run lint:design

      - name: Type check
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test

      - name: Verify Cloudflare credentials
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Missing CLOUDFLARE_API_TOKEN repository secret. Create a Cloudflare API token with Workers deploy permissions, then add it under GitHub → Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Check Google Ads conversion env
        run: node scripts/check-ads-env.mjs
        env:
          NEXT_PUBLIC_GOOGLE_ADS_ID: AW-18409243306
          NEXT_PUBLIC_GADS_LABEL_LEAD: AtDSCIa1--ccEKqFm8pE
          NEXT_PUBLIC_GADS_LABEL_AUDIT: ${{ secrets.NEXT_PUBLIC_GADS_LABEL_AUDIT }}
          NEXT_PUBLIC_GADS_LABEL_LP_WEB_DESIGN: ${{ secrets.NEXT_PUBLIC_GADS_LABEL_LP_WEB_DESIGN }}
          NEXT_PUBLIC_GADS_LABEL_LP_FACEBOOK_WEB_DESIGN: ${{ secrets.NEXT_PUBLIC_GADS_LABEL_LP_FACEBOOK_WEB_DESIGN }}
          NEXT_PUBLIC_GADS_LABEL_CALL: ${{ secrets.NEXT_PUBLIC_GADS_LABEL_CALL }}
          NEXT_PUBLIC_GADS_LABEL_BOOKING: ${{ secrets.NEXT_PUBLIC_GADS_LABEL_BOOKING }}
          NEXT_PUBLIC_BUSINESS_PHONE: ${{ secrets.NEXT_PUBLIC_BUSINESS_PHONE }}

      - name: Deploy to Cloudflare Workers
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          NEXT_PUBLIC_SITE_URL: https://www.kinexisdigital.com
          NEXT_PUBLIC_GA_ID: G-Z8245BRX2L
          NEXT_PUBLIC_GSC_VERIFICATION: 7uGCkyYE9LslqA7saQP7jpc0HrzVlVZvds1YX02sr6Q
          NEXT_PUBLIC_CLARITY_ID: ${{ secrets.NEXT_PUBLIC_CLARITY_ID }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
          # Google tag + primary lead conversion (public IDs; same pattern as GA4).
          NEXT_PUBLIC_GOOGLE_ADS_ID: AW-18409243306
          NEXT_PUBLIC_GADS_LABEL_LEAD: AtDSCIa1--ccEKqFm8pE
          NEXT_PUBLIC_GADS_LABEL_AUDIT: ${{ secrets.NEXT_PUBLIC_GADS_LABEL_AUDIT }}
          NEXT_PUBLIC_GADS_LABEL_LP_WEB_DESIGN: ${{ secrets.NEXT_PUBLIC_GADS_LABEL_LP_WEB_DESIGN }}
          NEXT_PUBLIC_GADS_LABEL_LP_FACEBOOK_WEB_DESIGN: ${{ secrets.NEXT_PUBLIC_GADS_LABEL_LP_FACEBOOK_WEB_DESIGN }}
          NEXT_PUBLIC_GADS_LABEL_CALL: ${{ secrets.NEXT_PUBLIC_GADS_LABEL_CALL }}
          NEXT_PUBLIC_GADS_LABEL_BOOKING: ${{ secrets.NEXT_PUBLIC_GADS_LABEL_BOOKING }}
          NEXT_PUBLIC_BUSINESS_PHONE: ${{ secrets.NEXT_PUBLIC_BUSINESS_PHONE }}

      - name: Submit URLs to IndexNow
        if: success()
        run: npm run submit:indexnow
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
